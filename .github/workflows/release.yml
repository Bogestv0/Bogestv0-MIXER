name: Release

# Запускается при создании тега вида v0.0.1 (или v0.1.0-beta.1 для тестовой сборки).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Драйвер виртуальных устройств собирается в том же запуске и кладётся внутрь установщика.
  driver:
    uses: ./.github/workflows/driver.yml

  windows:
    needs: driver
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Файлы драйвера идут в ресурсы установщика (src-tauri/driver, см. tauri.conf.json); установщик сам запускает install.ps1.
      - uses: actions/download-artifact@v4
        with:
          name: bogestv0-driver-x64
          path: src-tauri/driver

      - name: Проверка файлов драйвера
        shell: pwsh
        run: |
          $need = 'ComponentizedAudioSample.inf', 'TabletAudioSample.sys', 'package.cer', 'install.ps1', 'uninstall.ps1', 'install-driver.cmd', 'uninstall-driver.cmd'
          $missing = $need | Where-Object { -not (Test-Path (Join-Path 'src-tauri/driver' $_)) }
          Get-ChildItem src-tauri/driver | ForEach-Object { Write-Host $_.Name }
          if ($missing) { Write-Error ('В папке драйвера нет файлов: ' + ($missing -join ', ')); exit 1 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Звуковой движок кладётся рядом с приложением (Tauri добавит его в установщик).
      - name: Сборка движка
        shell: bash
        run: |
          cmake -S engine -B build-engine -A x64
          cmake --build build-engine --config Release
          build-engine/Release/engine.exe --selftest
          mkdir -p src-tauri/binaries
          cp build-engine/Release/engine.exe src-tauri/binaries/engine-x86_64-pc-windows-msvc.exe

      # Тег, package.json, Cargo.toml и tauri.conf.json должны иметь одну версию.
      - name: Проверка версии
        shell: bash
        run: node tools/check-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Текст релиза из CHANGELOG.md
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_EOF'
            node tools/release-notes.mjs "${GITHUB_REF_NAME#v}"
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Bogestv0 MIXER ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          # Тестовые версии (с дефисом в теге) не попадают в «latest» и не доходят до стабильных пользователей.
          prerelease: ${{ contains(github.ref_name, '-') }}
