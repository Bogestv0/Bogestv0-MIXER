[package]
name = "bogestv0-mixer"
version = "0.6.8"
description = "Bogestv0 MIXER — виртуальный аудиомикшер для Windows"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
# Одна копия программы: повторный запуск показывает уже открытое окно (src/main.rs).
tauri-plugin-single-instance = "2"
serde_json = "1"
# Удалённый пульт (src/remote.rs): веб-сервер с WebSocket для телефона в той же сети.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
