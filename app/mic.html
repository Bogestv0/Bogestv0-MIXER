<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Микрофон — настройки</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#f1f2f6;--surface:#fff;--surface-2:#eef0f5;--line:#e3e5ea;--fg:#0b0b0c;--muted:#667080;--signal:#1f77bd;--signal-ink:#fff;--signal-soft:#e6f1fb;--ok:#1a7f4b;--ok-soft:#e3f5ea;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#181818;--surface:#212121;--surface-2:#2a2a2a;--line:#2f2f2f;--fg:#f5f5f5;--muted:#a3a9b3;--signal:#6ab3f3;--signal-ink:#0b1a2a;--signal-soft:#1d3247;--ok:#7fd6a4;--ok-soft:#173326;--bad:#ff8a80;color-scheme:dark}}
body{margin:0;background:var(--bg)}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none}
html,body{height:100%;overflow:hidden}
</style>
<script src="dc.js"></script>
<script src="bridge.js"></script>
</head>
<body>
<template id="tpl">
<div style="width:100vw;height:100vh;box-sizing:border-box;padding:28px 40px;background:var(--bg);color:var(--fg);font:400 15px/1.5 'Onest',system-ui,sans-serif;display:flex;flex-direction:column;gap:18px;overflow:hidden">

  <div style="display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:16px">
      <a href="main.html" style="display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--fg);font-weight:500">← Микшер</a>
      <div>
        <h1 style="margin:0;font:600 22px/1.2 'Unbounded',sans-serif">{{mic}}</h1>
        <div style="font:400 11.5px 'JetBrains Mono',monospace;color:var(--muted);margin-top:4px">{{device}} · вход {{slot}} · 48 кГц</div>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <sc-for list="{{tabs}}" as="t"><a href="mic.html#{{t.i}}" data-tab="{{t.i}}" style="display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:12px;font:500 14px 'Onest',sans-serif;{{t.style}}">{{t.name}}</a></sc-for>
    </div>
  </div>

  <div style="flex:1;min-height:0;display:flex;gap:18px">
    <div style="flex:0 0 640px;display:flex;flex-direction:column;gap:18px">
      <div style="background:var(--surface);border-radius:20px;padding:22px;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <h2 style="margin:0;font:600 12px 'Onest',sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)">Шумоподавление</h2>
          <span style="font:500 12px 'JetBrains Mono',monospace;padding:3px 10px;border-radius:99px;{{badgeStyle}}">{{badge}}</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <sc-for list="{{modes}}" as="m">
            <button data-mode="{{m.v}}" aria-pressed="{{m.on}}" style="text-align:left;min-height:84px;padding:12px 14px;border-radius:14px;display:flex;flex-direction:column;gap:3px;{{m.style}}">
              <span style="font:600 15px 'Onest',sans-serif">{{m.name}}</span>
              <span style="font:400 12.5px/1.4 'Onest',sans-serif;opacity:.8">{{m.desc}}</span>
            </button>
          </sc-for>
        </div>
      </div>

      <div style="flex:1;background:var(--surface);border-radius:20px;padding:22px;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;gap:14px">
        <h2 style="margin:0;font:600 12px 'Onest',sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)">Проверка: уровень фонового шума в паузах</h2>
        <sc-for list="{{meters}}" as="r">
          <div style="display:flex;flex-direction:column;gap:6px">
            <div style="display:flex;justify-content:space-between;font-size:13.5px"><span>{{r.name}}</span><span data-ndb="{{r.key}}" style="font:500 13px 'JetBrains Mono',monospace;color:{{r.color}}">{{r.db}}</span></div>
            <div style="height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden"><div data-nbar="{{r.key}}" style="width:{{r.pct}}%;height:100%;border-radius:6px;background:{{r.color}};transition:width .25s"></div></div>
          </div>
        </sc-for>
        <div data-ntext style="font-size:13px;color:var(--muted)">{{checkText}}</div>
      </div>
    </div>

    <div style="flex:1;background:var(--surface);border-radius:20px;padding:22px;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;gap:16px">
      <h2 style="margin:0;font:600 12px 'Onest',sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)">Обработка голоса</h2>
      <sc-for list="{{sliders}}" as="p">
        <div style="display:flex;flex-direction:column;gap:7px;padding-bottom:14px;border-bottom:1px solid var(--line)">
          <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-weight:600">{{p.name}}</span><span data-val="{{p.key}}" style="font:500 14px 'JetBrains Mono',monospace;color:var(--signal)">{{p.val}}</span></div>
          <div data-slider="{{p.key}}" style="position:relative;height:28px;touch-action:none;cursor:pointer;opacity:{{p.opacity}}"><div style="position:absolute;left:0;right:0;top:11px;height:6px;border-radius:3px;background:var(--line)"><div data-fill style="width:{{p.pct}}%;height:100%;border-radius:3px;background:var(--signal)"></div></div><div data-thumb style="position:absolute;left:calc({{p.pct}}% - 11px);top:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:2px solid var(--signal);box-sizing:border-box"></div></div>
          <span style="font-size:12.5px;color:var(--muted)">{{p.desc}}</span>
          <sc-if value="{{p.hasQ}}"><div style="display:flex;gap:6px"><button data-q="0" style="flex:1;min-height:36px;border-radius:10px;font:500 13px 'JetBrains Mono',monospace;{{p.q0}}">+0</button><button data-q="10" style="flex:1;min-height:36px;border-radius:10px;font:500 13px 'JetBrains Mono',monospace;{{p.q1}}">+10</button><button data-q="20" style="flex:1;min-height:36px;border-radius:10px;font:500 13px 'JetBrains Mono',monospace;{{p.q2}}">+20</button><button data-q="30" style="flex:1;min-height:36px;border-radius:10px;font:500 13px 'JetBrains Mono',monospace;{{p.q3}}">+30</button></div></sc-if>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</template>
<div id="app"></div>
<script>
// Диапазоны и подписи ползунков. Значения уходят в движок командой «set mic» (см. bridge.js).
const SLIDERS = [
  { key: 'amt', mk: 'amt', name: 'Сила подавления', lo: 0, hi: 100, step: 1, desc: 'Выше сила, чище фон, но голос может звучать суше.', show: (v) => v + ' %' },
  { key: 'gate', mk: 'gate', name: 'Порог гейта', lo: -80, hi: -20, step: 1, desc: 'Тише порога микрофон закрывается, например между фразами. Крайнее левое положение выключает гейт.', show: (v) => (v <= -79 ? 'Выкл' : '−' + Math.abs(v) + ' дБ') },
  { key: 'hpf', mk: 'hpf', name: 'Фильтр низких частот', lo: 20, hi: 300, step: 5, desc: 'Убирает гул стола и стуки по корпусу. Крайнее левое положение выключает фильтр.', show: (v) => (v < 25 ? 'Выкл' : v + ' Гц') },
  { key: 'comp', mk: 'comp', name: 'Компрессор', lo: 1, hi: 10, step: 0.5, desc: 'Выравнивает громкость: тихие слова слышнее, крики мягче. Левое положение выключает компрессор.', show: (v) => (v <= 1.04 ? 'Выкл' : String(v).replace('.', ',') + ' : 1') },
  { key: 'gain', mk: 'g', name: 'Усиление', lo: 0, hi: 30, step: 1, desc: 'Программное, работает с любым микрофоном: от 0 до +30 дБ, защита от перегруза.', show: (v) => '+' + v + ' дБ' }
];
const NS_MODES = [
  ['Выкл', 'Звук как есть, без обработки.'], ['Мягкое', 'Гул вентилятора, шум комнаты.'],
  ['Сильное', 'Ещё клавиатура, мышь и эхо.'], ['Максимум', 'Остаётся только голос.']
];
function micIndex() { const n = parseInt((location.hash || '').slice(1), 10); return n === 1 ? 1 : 0; }
const dbText = (db) => (db == null || db < -95 ? '—' : db.toFixed(0).replace('-', '−') + ' дБ');
const dbPct = (db) => (db == null || db < -95 ? 0 : Math.max(0, Math.min(100, (db + 90) / 80 * 100)));

class Component extends DCLogic {
  renderVals() {
    const B = window.Bridge;
    const idx = micIndex();
    const mic = B.micOf(idx);
    const on = 'background:var(--signal-soft);color:var(--signal);border:1px solid var(--signal);box-shadow:0 0 0 1px var(--signal)';
    const off = 'background:var(--surface-2);color:var(--fg);border:1px solid transparent';
    const modes = NS_MODES.map((m, v) => ({ v, name: m[0], desc: m[1], on: mic.ns === v, style: mic.ns === v ? on : off }));
    const tabs = [0, 1].map((i) => ({ i, name: B.settings.strips[i].name, style: i === idx ? 'background:var(--signal);color:var(--signal-ink)' : 'background:var(--surface);color:var(--muted);border:1px solid var(--line)' }));
    const N = B.meters && B.meters.n ? B.meters.n[idx] : null;
    const meters = [
      { key: 'raw', name: 'Без обработки', db: dbText(N && N[0]), pct: dbPct(N && N[0]), color: 'var(--bad)' },
      { key: 'proc', name: 'С подавлением', db: dbText(N && N[1]), pct: dbPct(N && N[1]), color: 'var(--ok)' }
    ];
    const sliders = SLIDERS.map((d) => {
      const v = Math.max(d.lo, mic[d.mk]);   // движок хранит «выкл» как 0 (фильтр) — на ползунке это левый край
      const p = { key: d.key, name: d.name, val: d.show(v), pct: (v - d.lo) / (d.hi - d.lo) * 100, desc: d.desc, opacity: d.key === 'amt' && !mic.ns ? 0.45 : 1 };
      if (d.key === 'gain') { p.hasQ = true; [0, 10, 20, 30].forEach((q, k) => { p['q' + k] = mic.g === q ? on : off; }); }
      return p;
    });
    const dev = B.state && B.state.dev ? B.state.dev[idx ? 'hw2' : 'hw1'] : '';
    const nsOn = mic.ns > 0;
    return {
      mic: B.settings.strips[idx].name,
      device: dev || 'устройство не назначено',
      slot: idx ? 'HW2' : 'HW1',
      badge: nsOn ? 'Включено · нейросеть' : 'Выключено',
      badgeStyle: nsOn ? 'background:var(--ok-soft);color:var(--ok)' : 'background:var(--surface-2);color:var(--muted)',
      checkText: checkText(mic, N),
      modes, tabs, meters, sliders
    };
  }
}
function checkText(mic, N) {
  if (!mic.ns) return 'Шумоподавление выключено. Включите режим слева и помолчите несколько секунд: здесь появятся уровни фона.';
  if (!N || N[0] < -95) return 'Помолчите пару секунд: фон измеряется в паузах между словами.';
  const d = N[0] - (N[1] < -95 ? -95 : N[1]);
  return 'Подавление опускает фон на ' + Math.max(0, Math.round(d)) + ' дБ. Говорите как обычно: голос при этом должен звучать естественно.';
}
</script>
<script>DC.mount(Component);</script>
<script src="app.js"></script>
<script src="mic.js"></script>
</body>
</html>
