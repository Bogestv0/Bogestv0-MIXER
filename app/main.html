<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bogestv0 MIXER</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#f1f2f6;--surface:#fff;--surface-2:#eef0f5;--line:#e3e5ea;--fg:#0b0b0c;--muted:#667080;--signal:#1f77bd;--signal-ink:#fff;--signal-soft:#e6f1fb;--warn:#8a5a00;--warn-soft:#fdf1d8;--bad:#b3261e;--ok:#1a7f4b;--ok-soft:#e3f5ea;--m-mid:#d9a21b}
@media (prefers-color-scheme:dark){:root{--bg:#181818;--surface:#212121;--surface-2:#2a2a2a;--line:#2f2f2f;--fg:#f5f5f5;--muted:#a3a9b3;--signal:#6ab3f3;--signal-ink:#0b1a2a;--signal-soft:#1d3247;--warn:#f5cf8a;--warn-soft:#3a2c14;--bad:#ff8a80;--ok:#7fd6a4;--ok-soft:#173326;--m-mid:#f5cf8a;color-scheme:dark}}
body{margin:0;background:var(--bg)}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none}
html,body{height:100%;overflow:hidden}
</style>
<script src="dc.js"></script>
<script src="bridge.js"></script>
</head>
<body>
<template id="tpl">
<div style="width:100vw;height:100vh;display:flex;background:var(--bg);color:var(--fg);font:400 15px/1.5 'Onest',system-ui,sans-serif;overflow:hidden">

  <div style="flex:0 0 224px;box-sizing:border-box;padding:22px 14px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px">
    <div style="display:flex;align-items:center;gap:10px;padding:2px 10px 18px">
      <div style="width:34px;height:34px;border-radius:10px;background:#eef0f5;border:1px solid var(--line);display:flex;align-items:center;justify-content:center"><img src="logo.png" alt="Логотип Bogestv0" style="width:26px;height:26px;object-fit:contain"></div>
      <div><div style="font:600 15px/1.2 'Unbounded',sans-serif">Bogestv0</div><div style="font:400 11.5px 'JetBrains Mono',monospace;color:var(--muted);margin-top:2px">MIXER</div></div>
    </div>
    <sc-for list="{{nav}}" as="n">
      <a href="{{n.href}}" style="display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;font:500 15px 'Onest',sans-serif;{{n.style}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg>{{n.name}}
      </a>
    </sc-for>
    <div style="flex:1"></div>
    <div style="display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--surface-2)">
      <span style="align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--ok-soft);color:var(--ok)"><span style="width:7px;height:7px;border-radius:50%;background:var(--ok)"></span>Движок работает</span>
      <span style="font:400 12px/1.5 'JetBrains Mono',monospace;color:var(--muted)">48 кГц · 256 смп<br>задержка 5.3 мс</span>
    </div>
  </div>

  <div style="flex:1;min-width:0;box-sizing:border-box;padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <h1 style="margin:0;font:600 22px/1.2 'Unbounded',sans-serif">Микшер</h1>
        <div style="font:400 11.5px 'JetBrains Mono',monospace;color:var(--muted);margin-top:4px">8 входов · 2 микрофона и 6 виртуальных · маршруты на A1–A3 и B1–B2</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px"><span style="width:30px;height:30px;border-radius:50%;background:var(--signal-soft);color:var(--signal);display:flex;align-items:center;justify-content:center;font-size:13px">B</span>Bogestv0</div>
    </div>

    <div style="background:var(--signal-soft);border-radius:20px;padding:14px 22px;display:flex;gap:16px;align-items:center;justify-content:space-between">
      <div style="min-width:0">
        <h2 style="margin:0 0 2px;font:600 12px 'Onest',sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)">Сцены</h2>
        <div style="font:600 18px/1.2 'Unbounded',sans-serif;margin-bottom:3px">Куда идёт звук?</div>
        <div style="font-size:13px;color:var(--muted)">{{sceneDesc}}</div>
      </div>
      <div style="display:flex;gap:10px">
        <sc-for list="{{scenes}}" as="sc"><button data-act="scene" data-id="{{sc.id}}" style="min-height:44px;padding:9px 18px;border-radius:12px;font:500 14px 'Onest',sans-serif;{{sc.style}}">{{sc.name}}</button></sc-for>
      </div>
    </div>

    <div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;gap:24px">
        <h2 style="margin:0;width:281px;font:600 12px 'Onest',sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)">Железные входы · микрофоны</h2>
        <h2 style="margin:0;font:600 12px 'Onest',sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)">Виртуальные входы · звук из программ</h2>
      </div>
      <div style="flex:1;min-height:0;display:flex;gap:10px">
        <sc-for list="{{strips}}" as="s">
          <div style="flex:1;min-width:0;margin-left:{{s.ml}}px;box-sizing:border-box;background:var(--surface);box-shadow:0 1px 0 var(--line);border-radius:16px;padding:9px;display:flex;flex-direction:column;gap:9px">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:6px">
              <span style="flex:1;min-width:0;font:600 14px 'Onest',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{s.name}}</span><a href="strips.html" aria-label="Настройки дорожки {{s.name}}" style="flex:0 0 28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--muted)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 2v3M12 19v3M2 12h3M19 12h3M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z"/></svg></a>
              
            </div>

            <div style="height:150px;box-sizing:border-box;padding:10px;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:7px">
              <sc-if value="{{s.isMic}}">
                <div style="display:flex;flex-direction:column;gap:6px">
                  <div style="display:flex;justify-content:space-between;align-items:baseline">
                    <h2 style="margin:0;font:600 11px 'Onest',sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)">Шум</h2>
                    <a href="mic.html#{{s.i}}" title="Настройки микрофона: шумодав, гейт, компрессор, усиление" style="font:500 12px 'JetBrains Mono',monospace;color:var(--signal)">{{s.nsName}} ›</a>
                  </div>
                  <div style="display:grid;grid-template-columns:1fr 1fr;gap:3px">
                    <button data-act="ns" data-i="{{s.i}}" data-v="0" aria-pressed="{{s.n0On}}" style="flex:1;height:28px;border-radius:8px;padding:0;font:500 11px 'JetBrains Mono',monospace;{{s.n0}}">Выкл</button>
                    <button data-act="ns" data-i="{{s.i}}" data-v="1" aria-pressed="{{s.n1On}}" style="flex:1;height:28px;border-radius:8px;padding:0;font:500 11px 'JetBrains Mono',monospace;{{s.n1}}">Мяг</button>
                    <button data-act="ns" data-i="{{s.i}}" data-v="2" aria-pressed="{{s.n2On}}" style="flex:1;height:28px;border-radius:8px;padding:0;font:500 11px 'JetBrains Mono',monospace;{{s.n2}}">Сил</button>
                    <button data-act="ns" data-i="{{s.i}}" data-v="3" aria-pressed="{{s.n3On}}" style="flex:1;height:28px;border-radius:8px;padding:0;font:500 11px 'JetBrains Mono',monospace;{{s.n3}}">Макс</button>
                  </div>
                </div>
              </sc-if>
              <sc-if value="{{s.notMic}}">
                <div data-act="src" data-i="{{s.i}}" title="Нажмите: тестовый сигнал вместо программы (выкл → синус → шум)" style="display:flex;flex-direction:column;gap:2px;cursor:pointer">
                  <h2 style="margin:0;font:600 11px 'Onest',sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)">Источник</h2>
                  <span style="font:500 14px 'Onest',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{s.source}}</span>
                </div>
              </sc-if>
              <div style="display:flex;justify-content:space-around;margin-top:auto">
                <div style="display:flex;flex-direction:column;align-items:center;gap:3px">
                  <div data-knob="{{s.k1Key}}" data-i="{{s.i}}" title="{{s.k1Title}}" style="width:38px;height:38px;border-radius:50%;background:conic-gradient(from -135deg,var(--signal) 0deg,var(--signal) {{s.k1Deg}}deg,var(--line) {{s.k1Deg}}deg,var(--line) 270deg,transparent 270deg);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:{{s.k1Cursor}}"><div style="width:30px;height:30px;border-radius:50%;background:var(--surface);position:relative;transform:rotate({{s.k1Rot}}deg)"><div style="position:absolute;left:14px;top:3px;width:2px;height:9px;border-radius:1px;background:var(--fg)"></div></div></div>
                  <span data-klabel="{{s.k1Key}}{{s.i}}" style="font-size:12px;color:var(--muted)">{{s.k1Label}}</span>
                </div>
                <div style="display:flex;flex-direction:column;align-items:center;gap:3px">
                  <div data-knob="{{s.k2Key}}" data-i="{{s.i}}" title="{{s.k2Title}}" style="width:38px;height:38px;border-radius:50%;background:conic-gradient(from -135deg,var(--signal) 0deg,var(--signal) {{s.k2Deg}}deg,var(--line) {{s.k2Deg}}deg,var(--line) 270deg,transparent 270deg);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:{{s.k2Cursor}}"><div style="width:30px;height:30px;border-radius:50%;background:var(--surface);position:relative;transform:rotate({{s.k2Rot}}deg)"><div style="position:absolute;left:14px;top:3px;width:2px;height:9px;border-radius:1px;background:var(--fg)"></div></div></div>
                  <span data-klabel="{{s.k2Key}}{{s.i}}" style="font-size:12px;color:var(--muted)">{{s.k2Label}}</span>
                </div>
              </div>
            </div>

            <div style="display:flex;flex-direction:column;gap:6px">
              <h2 style="margin:0;font:600 11px 'Onest',sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)">Отправить на</h2>
              <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px">
                <button data-act="route" data-i="{{s.i}}" data-k="0" aria-pressed="{{s.a1On}}" style="min-height:34px;border-radius:10px;padding:0;font:500 13px 'JetBrains Mono',monospace;{{s.a1}}">A1</button>
                <button data-act="route" data-i="{{s.i}}" data-k="1" aria-pressed="{{s.a2On}}" style="min-height:34px;border-radius:10px;padding:0;font:500 13px 'JetBrains Mono',monospace;{{s.a2}}">A2</button>
                <button data-act="route" data-i="{{s.i}}" data-k="2" aria-pressed="{{s.a3On}}" style="min-height:34px;border-radius:10px;padding:0;font:500 13px 'JetBrains Mono',monospace;{{s.a3}}">A3</button>
                <button data-act="route" data-i="{{s.i}}" data-k="3" aria-pressed="{{s.b1On}}" style="min-height:34px;border-radius:10px;padding:0;font:500 13px 'JetBrains Mono',monospace;{{s.b1}}">B1</button>
                <button data-act="route" data-i="{{s.i}}" data-k="4" aria-pressed="{{s.b2On}}" style="min-height:34px;border-radius:10px;padding:0;font:500 13px 'JetBrains Mono',monospace;{{s.b2}}">B2</button>
              </div>
            </div>

            <div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:6px">
              <div data-db="{{s.i}}" style="text-align:center;font:500 13px 'JetBrains Mono',monospace;color:var(--signal)">{{s.tag}} · {{s.dbText}}</div>
              <div style="flex:1;min-height:0;display:flex;gap:8px;padding:0 14px">
                <div style="width:8px;border-radius:4px;position:relative;overflow:hidden;background:linear-gradient(to top,var(--ok) 0%,var(--ok) 60%,var(--m-mid) 82%,var(--bad) 100%)"><div data-meter="{{s.i}}l" style="position:absolute;left:0;right:0;top:0;height:{{s.meterL}}%;background:var(--surface-2)"></div></div>
                <div data-fader="{{s.i}}" title="Двойной щелчок: 0 дБ" style="flex:1;position:relative;touch-action:none;cursor:ns-resize"><div style="position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;border-radius:2px;background:var(--line)"></div>
                  <div data-cap="{{s.i}}" style="position:absolute;left:-4px;right:-4px;bottom:calc({{s.pos}}% - 17px);height:34px;border-radius:10px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.14);box-sizing:border-box;display:flex;align-items:center;justify-content:center;opacity:{{s.capOpacity}}"><div style="width:60%;height:3px;border-radius:2px;background:var(--signal)"></div></div>
                </div>
                <div style="width:8px;border-radius:4px;position:relative;overflow:hidden;background:linear-gradient(to top,var(--ok) 0%,var(--ok) 60%,var(--m-mid) 82%,var(--bad) 100%)"><div data-meter="{{s.i}}r" style="position:absolute;left:0;right:0;top:0;height:{{s.meterR}}%;background:var(--surface-2)"></div></div>
              </div>
            </div>

            <div style="display:flex;gap:6px">
              <button data-act="mute" data-i="{{s.i}}" aria-pressed="{{s.muted}}" style="flex:1;min-height:38px;border-radius:12px;font:500 13px 'Onest',sans-serif;{{s.muteStyle}}">Mute</button>
              <button data-act="solo" data-i="{{s.i}}" aria-pressed="{{s.soloOn}}" style="flex:1;min-height:38px;border-radius:12px;font:500 13px 'Onest',sans-serif;{{s.soloStyle}}">Solo</button>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</template>
<div id="app"></div>
<script>
class Component extends DCLogic {
  renderVals() {
    const B = window.Bridge;
    const S = B.settings;
    const st = B.state;                       // состояние движка (null, если не подключён)
    const M = B.meters;
    const pos = (db) => Math.max(0, Math.min(100, (db + 48) / 60 * 100));
    const fmt = (db) => (db > 0 ? '+' : '') + Number(db).toFixed(1) + ' дБ';
    const lvl = (lin) => Math.round(100 - Math.max(0, Math.min(100, (20 * Math.log10(Math.max(lin, 1e-6)) + 60) / 60 * 100)));
    const chip = (on, tone) => on
      ? 'background:var(--' + tone + '-soft);color:var(--' + tone + ');border:1px solid var(--' + tone + ');box-shadow:0 0 0 1px var(--' + tone + ')'
      : 'background:none;color:var(--muted);border:1px solid var(--line)';
    const nsChip = (on) => on
      ? 'background:var(--signal);color:var(--signal-ink);border:1px solid var(--signal)'
      : 'background:var(--surface);color:var(--fg);border:1px solid var(--line)';
    const nsNames = ['Выкл', 'Мягкое', 'Сильное', 'Максимум'];
    const srcNames = ['', 'Тест: синус', 'Тест: шум', 'Тест: файл'];
    const scene = S.scenes.find((x) => x.id === S.active);
    const strips = S.strips.map((d, i) => {
      const e = st ? st.strips[i] : { g: [-3, -5, -6, -14, -4, -9, -8, -12][i], m: 0, s: 0, r: scene ? scene.routes[i] : 0, src: 0 };
      const isMic = i < 2;
      const mic = isMic ? B.micOf(i) : null;
      const ns = isMic ? (mic.ns || 0) : 0;
      const o = {
        i, name: d.name, tag: d.tag, ml: i === 2 ? 14 : 0,
        source: e.src ? srcNames[e.src] : d.source, isMic, notMic: !isMic,
        nsName: nsNames[ns],
        k1Label: isMic ? 'Гейт' : 'Бас', k1Deg: 135, k1Rot: 0, k1Key: isMic ? 'gate' : 'bass', k1Title: isMic ? '' : 'Появится на этапе 5', k1Cursor: isMic ? 'ns-resize' : 'default',
        k2Label: isMic ? 'Компр.' : 'ВЧ', k2Deg: 135, k2Rot: 0, k2Key: isMic ? 'comp' : 'treble', k2Title: isMic ? '' : 'Появится на этапе 5', k2Cursor: isMic ? 'ns-resize' : 'default',
        dbText: fmt(e.g), pos: pos(e.g), capOpacity: 1,
        meterL: M ? lvl(M.s[i][0]) : 100, meterR: M ? lvl(M.s[i][1]) : 100,
        muted: !!e.m, soloOn: !!e.s,
        muteStyle: e.m ? 'background:var(--bad);color:#fff;border:1px solid var(--bad)' : 'background:none;color:var(--fg);border:1px solid var(--line)',
        soloStyle: e.s ? 'background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)' : 'background:none;color:var(--fg);border:1px solid var(--line)'
      };
      if (isMic) {
        // Крутилки: положение из значений движка. Гейт −80..−20 дБ (−80 = выкл), компрессор 1..10 (1 = выкл).
        const fg = Math.max(0, Math.min(1, (mic.gate + 80) / 60)), fc = Math.max(0, Math.min(1, (mic.comp - 1) / 9));
        o.k1Deg = Math.round(fg * 270); o.k1Rot = Math.round(fg * 270 - 135);
        o.k2Deg = Math.round(fc * 270); o.k2Rot = Math.round(fc * 270 - 135);
        o.k1Title = 'Гейт: ' + (mic.gate <= -79 ? 'выкл' : '−' + Math.abs(mic.gate) + ' дБ') + '. Тяните вверх и вниз, двойной щелчок сбрасывает';
        o.k2Title = 'Компрессор: ' + (mic.comp <= 1.04 ? 'выкл' : mic.comp + ' : 1') + '. Тяните вверх и вниз, двойной щелчок сбрасывает';
      }
      [0, 1, 2, 3].forEach((k) => { o['n' + k] = nsChip(ns === k); o['n' + k + 'On'] = ns === k; });
      ['a1', 'a2', 'a3', 'b1', 'b2'].forEach((key, k) => { const on = !!((e.r >> k) & 1); o[key] = chip(on, k < 3 ? 'signal' : 'warn'); o[key + 'On'] = on; });
      return o;
    });
    const navDefs = [
      ['Микшер', 'M6 4v16M12 4v16M18 4v16', 'main.html', 1], ['Выходы', 'M4 9v6h4l5 4V5L8 9H4zM16.5 8.5a5 5 0 0 1 0 7', 'outputs.html', 0],
      ['Сцены', 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z', 'scenes.html', 0], ['Эффекты', 'M3 12h3l2-6 4 12 3-9 2 3h4', 'effects.html', 0],
      ['Запись', 'M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16z', 'record.html', 0], ['Устройства', 'M7 3h10a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zM12 11a3 3 0 1 0 0 6a3 3 0 1 0 0-6z', 'devices.html', 0],
      ['Настройки', 'M12 2v3M12 19v3M2 12h3M19 12h3M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z', 'strips.html', 0]
    ];
    const nav = navDefs.map((n) => ({ name: n[0], d: n[1], href: n[2], style: n[3] ? 'background:var(--signal-soft);color:var(--signal);font-weight:600' : 'background:none;color:var(--muted)' }));
    const scenes = S.scenes.map((sc) => ({
      id: sc.id, name: sc.name,
      style: sc.id === S.active ? 'background:var(--signal);color:var(--signal-ink);border:1px solid var(--signal)' : 'background:var(--surface);color:var(--signal);border:1px solid transparent'
    }));
    const sceneDesc = scene ? scene.desc : 'Свои настройки: маршруты изменены вручную. Выберите сцену, чтобы вернуть готовый набор.';
    return { strips, nav, scenes, sceneDesc };
  }
}
</script>
<script>DC.mount(Component);</script>
<script src="app.js"></script>
<script src="mixer.js"></script>
</body>
</html>
