<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bogestv0 MIXER — Дорожки и аудио</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#f1f2f6;--surface:#fff;--surface-2:#eef0f5;--line:#e3e5ea;--fg:#0b0b0c;--muted:#667080;--signal:#1f77bd;--signal-ink:#fff;--signal-soft:#e6f1fb;--warn:#8a5a00;--warn-soft:#fdf1d8;--bad:#b3261e;--ok:#1a7f4b;--ok-soft:#e3f5ea}
@media (prefers-color-scheme:dark){:root{--bg:#181818;--surface:#212121;--surface-2:#2a2a2a;--line:#2f2f2f;--fg:#f5f5f5;--muted:#a3a9b3;--signal:#6ab3f3;--signal-ink:#0b1a2a;--signal-soft:#1d3247;--warn:#f5cf8a;--warn-soft:#3a2c14;--bad:#ff8a80;--ok:#7fd6a4;--ok-soft:#173326;color-scheme:dark}}
body{margin:0;background:var(--bg)}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none}
html,body{height:100%;overflow:hidden}
</style>
<script src="dc.js"></script>
<script src="bridge.js"></script>
</head>
<body>
<template id="tpl">
<div style="width:100vw;height:100vh;display:flex;background:var(--bg);color:var(--fg);font:400 15px/1.5 'Onest',system-ui,sans-serif;overflow:hidden">
  <div style="flex:0 0 224px;box-sizing:border-box;padding:22px 14px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px">
    <div style="display:flex;align-items:center;gap:10px;padding:2px 10px 18px">
      <div style="width:34px;height:34px;border-radius:10px;background:#eef0f5;border:1px solid var(--line);display:flex;align-items:center;justify-content:center"><img src="logo.png" alt="Логотип Bogestv0" style="width:26px;height:26px;object-fit:contain"></div>
      <div><div style="font:600 15px/1.2 'Unbounded',sans-serif">Bogestv0</div><div style="font:400 11.5px 'JetBrains Mono',monospace;color:var(--muted);margin-top:2px">MIXER</div></div>
    </div>
    <sc-for list="{{nav}}" as="n">
      <a href="{{n.href}}" style="display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;font:500 15px 'Onest',sans-serif;{{n.style}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg>{{n.name}}</a>
    </sc-for>
    <div style="flex:1"></div>
    <div style="display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--surface-2)">
      <span style="align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--ok-soft);color:var(--ok)"><span style="width:7px;height:7px;border-radius:50%;background:var(--ok)"></span>Движок работает</span>
      <span style="font:400 12px/1.5 'JetBrains Mono',monospace;color:var(--muted)">48 кГц · 256 смп<br>задержка 5.3 мс</span>
    </div>
  </div>
  <div style="flex:1;min-width:0;box-sizing:border-box;padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><h1 style="margin:0;font:600 22px/1.2 'Unbounded',sans-serif">Дорожки и аудио</h1><div style="font:400 11.5px 'JetBrains Mono',monospace;color:var(--muted);margin-top:4px">имена и видимость дорожек · аудио-параметры движка</div></div>
      <div style="display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px"><span style="width:30px;height:30px;border-radius:50%;background:var(--signal-soft);color:var(--signal);display:flex;align-items:center;justify-content:center;font-size:13px">B</span>Bogestv0</div>
    </div>
    <div style="flex:1;min-height:0;display:flex;gap:14px">
      <div style="flex:1;min-width:0;background:var(--surface);border-radius:20px;padding:20px;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;gap:8px">
        <h2 style="margin:0;font:600 12px 'Onest',sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)">Дорожки · имя и видимость</h2>
        <sc-for list="{{rows}}" as="r">
          <div style="display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:12px;background:var(--surface-2)">
            <span style="font:500 13px 'JetBrains Mono',monospace;width:44px;text-align:center;padding:2px 0;border-radius:99px;{{r.tagStyle}}">{{r.tag}}</span>
            <div style="flex:1;min-width:0;min-height:38px;padding:0 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;opacity:{{r.op}}"><span style="font-weight:600">{{r.name}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/></svg></div>
            <span style="width:200px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.src}}</span>
            <span style="font-size:12.5px;color:var(--muted);width:62px;text-align:right">{{r.state}}</span>
            <span aria-label="Показывать на микшере" style="position:relative;flex:0 0 44px;width:44px;height:24px;border-radius:12px;box-sizing:border-box;{{r.track}}"><span style="position:absolute;top:2px;width:18px;height:18px;border-radius:50%;{{r.knob}}"></span></span>
          </div>
        </sc-for>
        <div style="font-size:13px;color:var(--muted);margin-top:4px">Скрытая дорожка пропадает с микшера, но звук и маршруты остаются. Её можно вернуть здесь в любой момент. Название хранится в настройках и в сценах.</div>
      </div>
      <div style="flex:0 0 470px;background:var(--surface);border-radius:20px;padding:20px;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;gap:16px">
        <h2 style="margin:0;font:600 12px 'Onest',sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)">Аудио-движок</h2>
        <div style="display:flex;flex-direction:column;gap:6px"><span style="font-weight:600">Частота</span><div style="display:flex;gap:6px"><sc-for list="{{rates}}" as="x"><span style="flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;font:500 13px 'JetBrains Mono',monospace;{{x.style}}">{{x.name}}</span></sc-for></div></div>
        <div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between"><span style="font-weight:600">Буфер</span><span style="font:500 13px 'JetBrains Mono',monospace;color:var(--signal)">256 смп · 5.3 мс</span></div><div style="display:flex;gap:6px"><sc-for list="{{bufs}}" as="x"><span style="flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;font:500 13px 'JetBrains Mono',monospace;{{x.style}}">{{x.name}}</span></sc-for></div><span style="font-size:12.5px;color:var(--muted)">Меньше буфер, меньше задержка, но выше нагрузка. При щелчках в звуке выберите больше.</span></div>
        <div style="display:flex;flex-direction:column;gap:6px"><span style="font-weight:600">Задержка выходов</span><div style="display:flex;gap:8px"><sc-for list="{{delays}}" as="x"><div style="flex:1;padding:8px 12px;border-radius:10px;background:var(--surface-2)"><div style="font-size:12px;color:var(--muted)">{{x.tag}}</div><div style="font:500 13px 'JetBrains Mono',monospace">{{x.val}}</div></div></sc-for></div><span style="font-size:12.5px;color:var(--muted)">Выравнивает звук между колонками и наушниками, например при Bluetooth.</span></div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div><div style="font-weight:600">Лимитер выходов</div><div style="font-size:12.5px;color:var(--muted)">Защита от перегрузки на A1–A3 и B1–B2.</div></div><span aria-label="Лимитер" style="position:relative;flex:0 0 44px;width:44px;height:24px;border-radius:12px;box-sizing:border-box;background:var(--signal);border:1px solid var(--signal)"><span style="position:absolute;top:2px;left:22px;width:18px;height:18px;border-radius:50%;background:var(--signal-ink)"></span></span></div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div><div style="font-weight:600">Низкая задержка микрофона</div><div style="font-size:12.5px;color:var(--muted)">Захват «на себя»: другие программы не смогут слышать этот микрофон.</div></div><span aria-label="Низкая задержка" style="position:relative;flex:0 0 44px;width:44px;height:24px;border-radius:12px;box-sizing:border-box;background:var(--surface-2);border:1px solid var(--muted)"><span style="position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted)"></span></span></div>
      </div>
    </div>
  </div>
</div>
</template>
<div id="app"></div>
<script>
class Component extends DCLogic {
  renderVals() {
    const on = 'background:var(--signal);color:var(--signal-ink);border:1px solid var(--signal)';
    const off = 'background:var(--surface);color:var(--fg);border:1px solid var(--line)';
    const dot = (v) => v ? 'background:var(--signal)' : 'background:var(--surface-2);border:1px solid var(--line)';
    const navDefs = [['Микшер','M6 4v16M12 4v16M18 4v16','main.html'],['Выходы','M4 9v6h4l5 4V5L8 9H4zM16.5 8.5a5 5 0 0 1 0 7','#'],['Сцены','M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z','scenes.html'],['Эффекты','M3 12h3l2-6 4 12 3-9 2 3h4','effects.html'],['Запись','M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16z','record.html'],['Устройства','M7 3h10a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zM12 11a3 3 0 1 0 0 6a3 3 0 1 0 0-6z','#'],['Настройки','M12 2v3M12 19v3M2 12h3M19 12h3M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z','strips.html']];
    const nav = navDefs.map((n) => ({ name: n[0], d: n[1], href: n[2], style: n[0] === 'Настройки' ? 'background:var(--signal-soft);color:var(--signal);font-weight:600' : 'background:none;color:var(--muted)' }));
    const sig = 'background:var(--signal-soft);color:var(--signal)', wrn = 'background:var(--warn-soft);color:var(--warn)';
    const D = [['HW1','Микрофон 1','Микрофон (High Definition Audio)',1,wrn],['HW2','Микрофон 2','USB Microphone',1,wrn],['V1','Игры','Bogestv0 Input 1',1,sig],['V2','Музыка','Bogestv0 Input 2',1,sig],['V3','Discord','Bogestv0 Input 3',1,sig],['V4','Браузер','Bogestv0 Input 4',1,sig],['V5','Донаты','Bogestv0 Input 5',1,sig],['V6','Браузер 2','Bogestv0 Input 6',1,sig]];
    const rows = D.map((d) => ({ tag: d[0], name: d[1], src: d[2], tagStyle: d[4], op: d[3] ? 1 : 0.5, state: d[3] ? 'виден' : 'скрыт', track: d[3] ? 'background:var(--signal);border:1px solid var(--signal)' : 'background:var(--surface-2);border:1px solid var(--muted)', knob: d[3] ? 'left:22px;background:var(--signal-ink)' : 'left:2px;background:var(--muted)' }));
    const chip = (a) => a ? 'background:var(--signal);color:var(--signal-ink);border:1px solid var(--signal)' : 'background:var(--surface);color:var(--fg);border:1px solid var(--line)';
    const rates = [['44100 Гц',0],['48000 Гц',1]].map((r) => ({ name: r[0], style: chip(r[1]) }));
    const bufs = [['128',0],['256',1],['512',0],['1024',0]].map((r) => ({ name: r[0], style: chip(r[1]) }));
    const delays = ['A1','A2','A3'].map((t) => ({ tag: t, val: '0.00 мс' }));
    return { nav, rows, rates, bufs, delays };
  }
}
</script>
<script>DC.mount(Component);</script>
<script src="app.js"></script>
</body>
</html>
