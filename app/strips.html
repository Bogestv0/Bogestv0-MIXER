<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bogestv0 MIXER — Дорожки и аудио</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#f1f2f6;--surface:#fff;--surface-2:#eef0f5;--line:#e3e5ea;--fg:#0b0b0c;--muted:#667080;--signal:#1f77bd;--signal-ink:#fff;--signal-soft:#e6f1fb;--warn:#8a5a00;--warn-soft:#fdf1d8;--bad:#b3261e;--ok:#1a7f4b;--ok-soft:#e3f5ea}
@media (prefers-color-scheme:dark){:root{--bg:#181818;--surface:#212121;--surface-2:#2a2a2a;--line:#2f2f2f;--fg:#f5f5f5;--muted:#a3a9b3;--signal:#6ab3f3;--signal-ink:#0b1a2a;--signal-soft:#1d3247;--warn:#f5cf8a;--warn-soft:#3a2c14;--bad:#ff8a80;--ok:#7fd6a4;--ok-soft:#173326;color-scheme:dark}}
body{margin:0;background:var(--bg)}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none}
html,body{height:100%;overflow:hidden}
</style>
<script src="dc.js"></script>
<script src="bridge.js"></script>
</head>
<body>
<template id="tpl">
<div style="width:100vw;height:100vh;display:flex;background:var(--bg);color:var(--fg);font:400 15px/1.5 'Onest',system-ui,sans-serif;overflow:hidden">
  <div style="flex:0 0 224px;box-sizing:border-box;padding:22px 14px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px">
    <div style="display:flex;align-items:center;gap:10px;padding:2px 10px 18px">
      <div style="width:34px;height:34px;border-radius:10px;background:#eef0f5;border:1px solid var(--line);display:flex;align-items:center;justify-content:center"><img src="logo.png" alt="Логотип Bogestv0" style="width:26px;height:26px;object-fit:contain"></div>
      <div><div style="font:600 15px/1.2 'Unbounded',sans-serif">Bogestv0</div><div style="font:400 11.5px 'JetBrains Mono',monospace;color:var(--muted);margin-top:2px">MIXER</div></div>
    </div>
    <sc-for list="{{nav}}" as="n">
      <a href="{{n.href}}" style="display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;font:500 15px 'Onest',sans-serif;{{n.style}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg>{{n.name}}</a>
    </sc-for>
    <div style="flex:1"></div>
    <div style="display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--surface-2)">
      <span style="align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--ok-soft);color:var(--ok)"><span style="width:7px;height:7px;border-radius:50%;background:var(--ok)"></span>Движок работает</span>
      <span style="font:400 12px/1.5 'JetBrains Mono',monospace;color:var(--muted)">48 кГц · 256 смп<br>задержка 5.3 мс</span>
    </div>
  </div>
  <div style="flex:1;min-width:0;box-sizing:border-box;padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><h1 style="margin:0;font:600 22px/1.2 'Unbounded',sans-serif">Дорожки и аудио</h1><div style="font:400 11.5px 'JetBrains Mono',monospace;color:var(--muted);margin-top:4px">имена и видимость дорожек · аудио-параметры движка</div></div>
      <div style="display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px"><span style="width:30px;height:30px;border-radius:50%;background:var(--signal-soft);color:var(--signal);display:flex;align-items:center;justify-content:center;font-size:13px">B</span>Bogestv0</div>
    </div>
    <div style="flex:1;min-height:0;display:flex;gap:14px">
      <div style="flex:1;min-width:0;background:var(--surface);border-radius:20px;padding:20px;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;gap:8px">
        <h2 style="margin:0;font:600 12px 'Onest',sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)">Дорожки · имя и видимость</h2>
        <sc-for list="{{rows}}" as="r">
          <div style="display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:12px;background:var(--surface-2)">
            <span style="font:500 13px 'JetBrains Mono',monospace;width:44px;text-align:center;padding:2px 0;border-radius:99px;{{r.tagStyle}}">{{r.tag}}</span>
            <input type="text" value="{{r.name}}" maxlength="24" aria-label="Название дорожки {{r.tag}}" onchange="{{r.rename}}" style="flex:1;min-width:0;box-sizing:border-box;min-height:38px;padding:0 12px;border-radius:10px;background:var(--surface);color:var(--fg);border:1px solid var(--line);font:600 15px 'Onest',sans-serif;opacity:{{r.op}}">
            <span title="{{r.src}}" style="width:150px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.src}}</span>
            <span style="font-size:12.5px;color:var(--muted);width:44px;text-align:right">{{r.state}}</span>
            <button role="switch" aria-checked="{{r.on}}" aria-label="Показывать дорожку {{r.tag}} на микшере" onclick="{{r.toggle}}" style="position:relative;flex:0 0 44px;width:44px;height:24px;padding:0;border-radius:12px;box-sizing:border-box;{{r.track}}"><span style="position:absolute;top:2px;width:18px;height:18px;border-radius:50%;{{r.knob}}"></span></button>
          </div>
        </sc-for>
        <div style="font-size:13px;color:var(--muted);margin-top:4px">Скрытая дорожка пропадает с микшера, но звук и маршруты остаются. Её можно вернуть здесь в любой момент. Название хранится в настройках; пустое название возвращает стандартное.</div>
      </div>
      <div style="flex:0 0 470px;background:var(--surface);border-radius:20px;padding:20px;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;gap:16px">
        <h2 style="margin:0;font:600 12px 'Onest',sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)">Аудио-движок</h2>
        <div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between"><span style="font-weight:600">Частота</span><span style="font:500 13px 'JetBrains Mono',monospace;color:var(--signal)">{{rateText}}</span></div><div style="display:flex;gap:6px"><sc-for list="{{rates}}" as="x"><button aria-disabled="{{x.off}}" title="{{x.title}}" style="flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;font:500 13px 'JetBrains Mono',monospace;{{x.style}}">{{x.name}}</button></sc-for></div><span style="font-size:12.5px;color:var(--muted)">Драйвер виртуальных устройств работает на 48 кГц, поэтому весь тракт идёт на 48 кГц. Выбор 44,1 кГц появится вместе с ресемплингом (этап 6.6).</span></div>
        <div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between"><span style="font-weight:600">Буфер</span><span style="font:500 13px 'JetBrains Mono',monospace;color:var(--signal)">{{bufText}}</span></div><div style="display:flex;gap:6px"><sc-for list="{{bufs}}" as="x"><button onclick="{{x.pick}}" aria-pressed="{{x.on}}" style="flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;font:500 13px 'JetBrains Mono',monospace;{{x.style}}">{{x.name}}</button></sc-for></div><span style="font-size:12.5px;color:var(--muted)">Размер блока главного выхода (A1). Меньше блок, меньше задержка, но выше нагрузка; при хрипе и щелчках выберите больше. 480 (10 мс): значение по умолчанию. Смена перезапускает аудио на долю секунды.</span></div>
        <div style="display:flex;flex-direction:column;gap:6px"><span style="font-weight:600">Задержка выходов</span><div style="display:flex;gap:8px"><sc-for list="{{delays}}" as="x"><label style="flex:1;padding:8px 12px;border-radius:10px;background:var(--surface-2);display:block"><div style="font-size:12px;color:var(--muted)">{{x.tag}}, мс</div><input type="number" min="0" max="500" step="0.5" value="{{x.val}}" aria-label="Задержка {{x.tag}}, миллисекунды" onchange="{{x.set}}" style="width:100%;box-sizing:border-box;border:0;background:transparent;color:var(--fg);font:500 14px 'JetBrains Mono',monospace;padding:2px 0"></label></sc-for></div><span style="font-size:12.5px;color:var(--muted)">Выравнивает звук между колонками и наушниками, например при Bluetooth: задержите тот выход, который идёт раньше. 0…500 мс.</span></div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div><div style="font-weight:600">Лимитер выходов</div><div style="font-size:12.5px;color:var(--muted)">Защита от перегрузки на A1–A3 и B1–B2. Без него звук выше 0 дБ просто обрезается.</div></div><button role="switch" aria-checked="{{limOn}}" aria-label="Лимитер выходов" onclick="{{limToggle}}" style="position:relative;flex:0 0 44px;width:44px;height:24px;padding:0;border-radius:12px;box-sizing:border-box;{{limTrack}}"><span style="position:absolute;top:2px;width:18px;height:18px;border-radius:50%;{{limKnob}}"></span></button></div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;opacity:.55"><div><div style="font-weight:600">Низкая задержка микрофона</div><div style="font-size:12.5px;color:var(--muted)">Захват «на себя»: другие программы не смогут слышать этот микрофон. Пока недоступно.</div></div><button role="switch" aria-checked="false" aria-label="Низкая задержка" disabled title="Появится в одном из следующих обновлений" style="position:relative;flex:0 0 44px;width:44px;height:24px;padding:0;border-radius:12px;box-sizing:border-box;background:var(--surface-2);border:1px solid var(--muted)"><span style="position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted)"></span></button></div>
      </div>
    </div>
  </div>
</div>
</template>
<div id="app"></div>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // Перерисовываем по событиям движка, но не пока человек печатает в поле (иначе пропадёт фокус).
    Bridge.on((t) => {
      if (!['state', 'conn', 'ready', 'app'].includes(t) || !window.__dc) return;
      const a = document.activeElement;
      if (a && a.tagName === 'INPUT') return;
      window.__dc.setState({});
    });
  }
  renderVals() {
    const navDefs = [['Микшер','M6 4v16M12 4v16M18 4v16','main.html'],['Выходы','M4 9v6h4l5 4V5L8 9H4zM16.5 8.5a5 5 0 0 1 0 7','#'],['Сцены','M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z','scenes.html'],['Эффекты','M3 12h3l2-6 4 12 3-9 2 3h4','effects.html'],['Запись','M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16z','record.html'],['Устройства','M7 3h10a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zM12 11a3 3 0 1 0 0 6a3 3 0 1 0 0-6z','#'],['Настройки','M12 2v3M12 19v3M2 12h3M19 12h3M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z','settings.html']];
    const nav = navDefs.map((n) => ({ name: n[0], d: n[1], href: n[2], style: n[0] === 'Настройки' ? 'background:var(--signal-soft);color:var(--signal);font-weight:600' : 'background:none;color:var(--muted)' }));
    const B = window.Bridge;
    const S = B.settings, st = B.state, au = B.audioOf();
    const dev = (st && st.dev) || S.devices || {};
    const sig = 'background:var(--signal-soft);color:var(--signal)', wrn = 'background:var(--warn-soft);color:var(--warn)';
    const save = () => { B.scheduleSave(); this.setState({}); };
    const rows = S.strips.map((d, i) => {
      const shown = !d.hidden;
      const src = i < 2 ? (dev[i === 0 ? 'hw1' : 'hw2'] || 'Устройство не выбрано') : 'Bogestv0 ' + ['Games', 'Music', 'Discord', 'Browser 1', 'Donations', 'Browser 2'][i - 2] + ' In';
      return {
        tag: d.tag, name: d.name, src, tagStyle: i < 2 ? wrn : sig, op: shown ? 1 : 0.5,
        state: shown ? 'виден' : 'скрыт', on: shown,
        track: shown ? 'background:var(--signal);border:1px solid var(--signal)' : 'background:var(--surface-2);border:1px solid var(--muted)',
        knob: shown ? 'left:22px;background:var(--signal-ink)' : 'left:2px;background:var(--muted)',
        rename: (ev) => { const v = (ev.target.value || '').trim().slice(0, 24); d.name = v || B.STRIP_DEFAULTS[i].name; save(); },
        toggle: () => {
          const visible = S.strips.filter((x) => !x.hidden).length;
          if (shown && visible <= 1) { B.notice('Хотя бы одна дорожка должна оставаться на микшере.'); return; }
          d.hidden = shown; save();
        }
      };
    });
    const chip = (a) => a ? 'background:var(--signal);color:var(--signal-ink);border:1px solid var(--signal)' : 'background:var(--surface);color:var(--fg);border:1px solid var(--line)';
    const rates = [['44100 Гц', 0, true], ['48000 Гц', 1, false]].map((r) => ({ name: r[0], off: r[2], title: r[2] ? 'Недоступно: драйвер работает на 48 кГц' : '', style: chip(r[1]) + (r[2] ? ';opacity:.45;cursor:not-allowed' : '') }));
    const BUFS = [128, 256, 480, 512, 1024];
    const bufs = BUFS.map((n) => ({
      name: n === 480 ? '480 (авто)' : String(n), on: au.buf === n, style: chip(au.buf === n),
      pick: () => { B.setAudio('buffer', n); this.setState({}); }
    }));
    const delays = ['A1', 'A2', 'A3'].map((t, k) => ({
      tag: t, val: Number(au.dly[k] || 0).toFixed(1).replace(/\.0$/, ''),
      set: (ev) => { const v = Math.max(0, Math.min(500, parseFloat(String(ev.target.value).replace(',', '.')) || 0)); ev.target.value = v; B.setAudio('delay', k, v); this.setState({}); }
    }));
    const on = !!au.lim;
    return {
      nav, rows, rates, bufs, delays,
      rateText: '48000 Гц',
      bufText: au.buf + ' смп · ' + (au.buf / 48).toFixed(1) + ' мс',
      limOn: on, limToggle: () => { B.setAudio('limiter', !on); this.setState({}); },
      limTrack: on ? 'background:var(--signal);border:1px solid var(--signal)' : 'background:var(--surface-2);border:1px solid var(--muted)',
      limKnob: on ? 'left:22px;background:var(--signal-ink)' : 'left:2px;background:var(--muted)'
    };
  }
}
</script>
<script>DC.mount(Component);</script>
<script src="app.js"></script>
</body>
</html>
