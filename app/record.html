<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bogestv0 MIXER — Запись</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#f1f2f6;--surface:#fff;--surface-2:#eef0f5;--line:#e3e5ea;--fg:#0b0b0c;--muted:#667080;--signal:#1f77bd;--signal-ink:#fff;--signal-soft:#e6f1fb;--warn:#8a5a00;--warn-soft:#fdf1d8;--bad:#b3261e;--ok:#1a7f4b;--ok-soft:#e3f5ea}
@media (prefers-color-scheme:dark){:root{--bg:#181818;--surface:#212121;--surface-2:#2a2a2a;--line:#2f2f2f;--fg:#f5f5f5;--muted:#a3a9b3;--signal:#6ab3f3;--signal-ink:#0b1a2a;--signal-soft:#1d3247;--warn:#f5cf8a;--warn-soft:#3a2c14;--bad:#ff8a80;--ok:#7fd6a4;--ok-soft:#173326;color-scheme:dark}}
body{margin:0;background:var(--bg)}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none}
html,body{height:100%;overflow:hidden}
</style>
<script src="dc.js"></script>
<script src="bridge.js"></script>
</head>
<body>
<template id="tpl">
<div style="width:100vw;height:100vh;display:flex;background:var(--bg);color:var(--fg);font:400 15px/1.5 'Onest',system-ui,sans-serif;overflow:hidden">
  <div style="flex:0 0 224px;box-sizing:border-box;padding:22px 14px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px">
    <div style="display:flex;align-items:center;gap:10px;padding:2px 10px 18px">
      <div style="width:34px;height:34px;border-radius:10px;background:#eef0f5;border:1px solid var(--line);display:flex;align-items:center;justify-content:center"><img src="logo.png" alt="Логотип Bogestv0" style="width:26px;height:26px;object-fit:contain"></div>
      <div><div style="font:600 15px/1.2 'Unbounded',sans-serif">Bogestv0</div><div style="font:400 11.5px 'JetBrains Mono',monospace;color:var(--muted);margin-top:2px">MIXER</div></div>
    </div>
    <sc-for list="{{nav}}" as="n">
      <a href="{{n.href}}" style="display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;font:500 15px 'Onest',sans-serif;{{n.style}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg>{{n.name}}</a>
    </sc-for>
    <div style="flex:1"></div>
    <div style="display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--surface-2)">
      <span style="align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--ok-soft);color:var(--ok)"><span style="width:7px;height:7px;border-radius:50%;background:var(--ok)"></span>Движок работает</span>
      <span style="font:400 12px/1.5 'JetBrains Mono',monospace;color:var(--muted)">48 кГц · 256 смп<br>задержка 5.3 мс</span>
    </div>
  </div>
  <div style="flex:1;min-width:0;box-sizing:border-box;padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><h1 style="margin:0;font:600 22px/1.2 'Unbounded',sans-serif">Запись</h1><div style="font:400 11.5px 'JetBrains Mono',monospace;color:var(--muted);margin-top:4px">пишем звук с выбранных выходов в WAV, 24 бита, 48 кГц</div></div>
      <div style="display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px"><span style="width:30px;height:30px;border-radius:50%;background:var(--signal-soft);color:var(--signal);display:flex;align-items:center;justify-content:center;font-size:13px">B</span>Bogestv0</div>
    </div>
    <div style="flex:1;min-height:0;display:flex;gap:14px">
      <div style="flex:1;min-width:0;overflow:auto;background:var(--surface);border-radius:20px;padding:20px;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;gap:16px">
        <h2 style="margin:0;font:600 12px 'Onest',sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)">Что записывать</h2>
        <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">
          <sc-for list="{{src}}" as="s"><button data-rbus="{{s.k}}" aria-pressed="{{s.on}}" style="min-height:64px;padding:8px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;{{s.style}}"><span style="font:500 15px 'JetBrains Mono',monospace">{{s.tag}}</span><span style="font-size:12px;opacity:.85">{{s.role}}</span></button></sc-for>
        </div>
        <div style="display:flex;gap:18px;flex-wrap:wrap">
          <div style="display:flex;flex-direction:column;gap:6px"><h2 style="margin:0;font:600 12px 'Onest',sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)">Файлы</h2><div style="display:flex;gap:6px"><button data-rmode="separate" aria-pressed="{{sepOn}}" style="min-height:44px;padding:0 18px;border-radius:12px;font:500 14px 'Onest',sans-serif;{{m1}}">Раздельно</button><button data-rmode="mixed" aria-pressed="{{mixOn}}" style="min-height:44px;padding:0 18px;border-radius:12px;font:500 14px 'Onest',sans-serif;{{m2}}">Один общий</button></div></div>
          <div style="display:flex;flex-direction:column;gap:6px"><h2 style="margin:0;font:600 12px 'Onest',sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)">Формат</h2><div style="display:flex;gap:6px"><span style="min-height:44px;padding:0 18px;border-radius:12px;font:500 14px 'Onest',sans-serif;display:inline-flex;align-items:center;background:var(--signal);color:var(--signal-ink);border:1px solid var(--signal)">WAV</span><span title="Для MP3 нужен отдельный кодировщик, он пока не подключён" style="min-height:44px;padding:0 18px;border-radius:12px;font:500 14px 'Onest',sans-serif;display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--muted);border:1px dashed var(--line)">MP3 <span style="font-size:11px">скоро</span></span></div></div>
          <div style="display:flex;flex-direction:column;gap:6px;flex:1;min-width:220px"><h2 style="margin:0;font:600 12px 'Onest',sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)">Папка</h2><div style="display:flex;gap:6px"><div data-rdir style="flex:1;min-width:0;font:500 13px 'JetBrains Mono',monospace;min-height:44px;display:flex;align-items:center;padding:0 14px;border-radius:12px;background:var(--surface-2);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="{{dir}}">{{dir}}</div><button data-act="rdir" style="min-height:44px;padding:0 14px;border-radius:12px;font:500 14px 'Onest',sans-serif;background:var(--surface);color:var(--fg);border:1px solid var(--line);{{lockStyle}}">Изменить</button></div></div>
        </div>
        <div style="flex:1;min-height:220px;border-radius:18px;background:var(--surface-2);padding:20px;display:flex;flex-direction:column;gap:14px;justify-content:center">
          <div style="display:flex;align-items:center;gap:20px">
            <button data-act="rtoggle" aria-label="{{btnLabel}}" style="width:72px;height:72px;flex-shrink:0;border-radius:50%;background:var(--bad);border:0;display:flex;align-items:center;justify-content:center;{{btnStyle}}"><span style="{{iconStyle}}"></span></button>
            <div><div data-rtimer style="font:500 36px/1.1 'JetBrains Mono',monospace">{{timer}}</div><div style="font-size:13px;color:{{statusColor}};margin-top:2px">{{status}}</div></div>
          </div>
          <sc-for list="{{meters}}" as="m"><div style="display:flex;align-items:center;gap:12px"><span style="font:500 13px 'JetBrains Mono',monospace;width:120px;flex-shrink:0">{{m.name}}</span><div style="flex:1;height:10px;border-radius:5px;background:var(--line);overflow:hidden"><div data-rmeter="{{m.k}}" style="width:0%;height:100%;border-radius:5px;background:linear-gradient(to right,var(--ok),var(--ok) 70%,var(--warn))"></div></div></div></sc-for>
        </div>
      </div>
      <div style="flex:0 0 400px;overflow:auto;background:var(--surface);border-radius:20px;padding:20px;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;gap:10px">
        <h2 style="margin:0;font:600 12px 'Onest',sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)">Записи</h2>
        <div style="font-size:13px;color:var(--muted);{{emptyStyle}}">{{emptyText}}</div>
        <sc-for list="{{files}}" as="f"><div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2)"><div style="min-width:0;flex:1"><div style="font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="{{f.name}}">{{f.name}}</div><div style="font:500 12px 'JetBrains Mono',monospace;color:var(--muted)">{{f.info}}</div></div>
          <button data-rreveal="{{f.name}}" aria-label="Показать в папке" title="Показать в папке" style="width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;padding:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
          <button data-rdel="{{f.name}}" aria-label="Удалить запись" title="Удалить" style="width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--bad);display:inline-flex;align-items:center;justify-content:center;padding:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></div></sc-for>
      </div>
    </div>
  </div>
</div>
</template>
<div id="app"></div>
<script>
class Component extends DCLogic {
  renderVals() {
    const B = window.Bridge;
    const st = B.state, S = B.settings;
    const rec = st && st.rec ? st.rec : null;
    const recOn = !!(rec && rec.on);
    const mask = rec ? rec.mask : S.rec.mask;
    const mixed = rec ? !!rec.mixed : S.rec.mode === 'mixed';
    const on = 'background:var(--signal);color:var(--signal-ink);border:1px solid var(--signal)';
    const off = 'background:var(--surface);color:var(--fg);border:1px solid var(--line)';
    const navDefs = [['Микшер','M6 4v16M12 4v16M18 4v16','main.html'],['Выходы','M4 9v6h4l5 4V5L8 9H4zM16.5 8.5a5 5 0 0 1 0 7','outputs.html'],['Сцены','M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z','scenes.html'],['Эффекты','M3 12h3l2-6 4 12 3-9 2 3h4','effects.html'],['Запись','M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16z','record.html'],['Устройства','M7 3h10a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zM12 11a3 3 0 1 0 0 6a3 3 0 1 0 0-6z','devices.html'],['Настройки','M12 2v3M12 19v3M2 12h3M19 12h3M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z','settings.html']];
    const nav = navDefs.map((n) => ({ name: n[0], d: n[1], href: n[2], style: n[0] === 'Запись' ? 'background:var(--signal-soft);color:var(--signal);font-weight:600' : 'background:none;color:var(--muted)' }));
    const S5 = [['A1','Колонки'],['A2','Наушники'],['A3','Запасной'],['B1','Для стрима'],['B2','Для звонков']];
    const lock = recOn ? 'opacity:.5;cursor:default' : '';
    const src = S5.map((s, k) => {
      const v = !!((mask >> k) & 1);
      return { k, tag: s[0], role: s[1], on: v, style: (v ? 'background:var(--signal-soft);color:var(--signal);border:1px solid var(--signal);box-shadow:0 0 0 1px var(--signal)' : 'background:none;color:var(--muted);border:1px solid var(--line)') + ';' + lock };
    });
    const picked = S5.map((s, k) => ({ k, name: s[0] + ' ' + s[1] })).filter((x) => (mask >> x.k) & 1);
    const n = picked.length;
    const files = ((B.recs && B.recs.files) || []).map((f) => {
      const t = Math.round(f.s), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), sec = t % 60;
      const dur = (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(sec).padStart(2, '0');
      return { name: f.n, info: dur + ' · ' + (f.b / 1048576 >= 10 ? Math.round(f.b / 1048576) : (f.b / 1048576).toFixed(1).replace('.', ',')) + ' МБ' };
    });
    let status, statusColor = 'var(--muted)';
    if (!st) { status = 'Нет связи с движком'; statusColor = 'var(--warn)'; }
    else if (recOn) { status = 'Идёт запись · ' + (mixed ? 'один файл из ' + n : n) + (mixed ? ' ' + (n === 1 ? 'источника' : 'источников') : (n === 1 ? ' файл' : n < 5 ? ' файла' : ' файлов')); statusColor = 'var(--bad)'; }
    else if (!n) { status = 'Выберите, что записывать'; statusColor = 'var(--warn)'; }
    else status = 'Готово к записи · ' + n + (n === 1 ? ' источник' : n < 5 ? ' источника' : ' источников');
    if (rec && rec.err) { status = rec.err; statusColor = 'var(--bad)'; }
    const stopIcon = 'width:24px;height:24px;border-radius:5px;background:var(--signal-ink)';
    const dotIcon = 'width:26px;height:26px;border-radius:50%;background:var(--signal-ink)';
    return {
      nav, src, meters: picked, files,
      sepOn: !mixed, mixOn: mixed, m1: (mixed ? off : on) + ';' + lock, m2: (mixed ? on : off) + ';' + lock, lockStyle: lock,
      dir: (rec && rec.dir) || S.rec.dir || 'не задана',
      btnLabel: recOn ? 'Остановить запись' : 'Начать запись', iconStyle: recOn ? stopIcon : dotIcon,
      btnStyle: recOn || (st && n) ? '' : 'opacity:.45;cursor:default',
      timer: '00:00:00', status, statusColor,
      emptyText: B.recs ? (files.length ? '' : 'В этой папке пока нет записей.') : 'Список появится, когда движок ответит.', emptyStyle: files.length ? 'display:none' : ''
    };
  }
}
</script>
<script>DC.mount(Component);</script>
<script src="app.js"></script>
<script src="record.js"></script>
</body>
</html>
