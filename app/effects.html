<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bogestv0 MIXER — Эффекты</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#f1f2f6;--surface:#fff;--surface-2:#eef0f5;--line:#e3e5ea;--fg:#0b0b0c;--muted:#667080;--signal:#1f77bd;--signal-ink:#fff;--signal-soft:#e6f1fb;--warn:#8a5a00;--warn-soft:#fdf1d8;--bad:#b3261e;--ok:#1a7f4b;--ok-soft:#e3f5ea}
@media (prefers-color-scheme:dark){:root{--bg:#181818;--surface:#212121;--surface-2:#2a2a2a;--line:#2f2f2f;--fg:#f5f5f5;--muted:#a3a9b3;--signal:#6ab3f3;--signal-ink:#0b1a2a;--signal-soft:#1d3247;--warn:#f5cf8a;--warn-soft:#3a2c14;--bad:#ff8a80;--ok:#7fd6a4;--ok-soft:#173326;color-scheme:dark}}
body{margin:0;background:var(--bg)}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none}
html,body{height:100%;overflow:hidden}
</style>
<script src="dc.js"></script>
<script src="bridge.js"></script>
</head>
<body>
<template id="tpl">
<div style="width:100vw;height:100vh;display:flex;background:var(--bg);color:var(--fg);font:400 15px/1.5 'Onest',system-ui,sans-serif;overflow:hidden">
  <div style="flex:0 0 224px;box-sizing:border-box;padding:22px 14px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px">
    <div style="display:flex;align-items:center;gap:10px;padding:2px 10px 18px">
      <div style="width:34px;height:34px;border-radius:10px;background:#eef0f5;border:1px solid var(--line);display:flex;align-items:center;justify-content:center"><img src="logo.png" alt="Логотип Bogestv0" style="width:26px;height:26px;object-fit:contain"></div>
      <div><div style="font:600 15px/1.2 'Unbounded',sans-serif">Bogestv0</div><div style="font:400 11.5px 'JetBrains Mono',monospace;color:var(--muted);margin-top:2px">MIXER</div></div>
    </div>
    <sc-for list="{{nav}}" as="n">
      <a href="{{n.href}}" style="display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;font:500 15px 'Onest',sans-serif;{{n.style}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg>{{n.name}}</a>
    </sc-for>
    <div style="flex:1"></div>
    <div style="display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--surface-2)">
      <span style="align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--ok-soft);color:var(--ok)"><span style="width:7px;height:7px;border-radius:50%;background:var(--ok)"></span>Движок работает</span>
      <span style="font:400 12px/1.5 'JetBrains Mono',monospace;color:var(--muted)">48 кГц · 256 смп<br>задержка 5.3 мс</span>
    </div>
  </div>
  <div style="flex:1;min-width:0;box-sizing:border-box;padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><h1 style="margin:0;font:600 22px/1.2 'Unbounded',sans-serif">Эффекты</h1><div style="font:400 11.5px 'JetBrains Mono',monospace;color:var(--muted);margin-top:4px">звуки на кнопках · играют на B1, B2 или в наушники</div></div>
      <div style="display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px"><span style="width:30px;height:30px;border-radius:50%;background:var(--signal-soft);color:var(--signal);display:flex;align-items:center;justify-content:center;font-size:13px">B</span>Bogestv0</div>
    </div>
    <div style="background:var(--surface);border-radius:20px;padding:20px;box-shadow:0 1px 0 var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px">
      <div style="display:flex;align-items:center;gap:12px"><h2 style="margin:0;font:600 12px 'Onest',sans-serif;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)">Играть на</h2>
        <sc-for list="{{outs}}" as="o"><button aria-pressed="{{o.on}}" style="min-height:44px;padding:0 18px;border-radius:12px;font:500 14px 'Onest',sans-serif;{{o.style}}">{{o.name}}</button></sc-for>
      </div>
      <div style="display:flex;align-items:center;gap:14px"><span style="font-size:13px;color:var(--muted)">Громкость</span><div style="position:relative;width:180px;height:6px;border-radius:3px;background:var(--line)"><div style="width:72%;height:100%;border-radius:3px;background:var(--signal)"></div><div style="position:absolute;left:calc(72% - 11px);top:-8px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:2px solid var(--signal);box-sizing:border-box"></div></div><span style="font:500 13px 'JetBrains Mono',monospace;color:var(--signal)">−4 дБ</span>
        <button style="min-height:44px;padding:0 18px;border-radius:12px;font:500 14px 'Onest',sans-serif;background:var(--surface);color:var(--bad);border:1px solid var(--bad)">Стоп всё</button></div>
    </div>
    <div style="flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:12px">
      <sc-for list="{{pads}}" as="p">
        <button style="text-align:left;padding:14px 16px;border-radius:18px;display:flex;flex-direction:column;justify-content:space-between;{{p.style}}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;width:100%"><span style="font:600 16px/1.25 'Onest',sans-serif">{{p.name}}</span><span style="font:500 13px 'JetBrains Mono',monospace;font-size:11.5px;padding:2px 8px;border-radius:8px;background:var(--surface-2);color:var(--muted)">{{p.key}}</span></div>
          <div style="width:100%"><div style="font:500 13px 'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:6px">{{p.len}}</div><div style="height:5px;border-radius:3px;background:var(--line);overflow:hidden"><div style="width:{{p.pct}}%;height:100%;background:var(--signal)"></div></div></div>
        </button>
      </sc-for>
      <button style="padding:14px;border-radius:18px;background:none;color:var(--signal);border:1px dashed var(--signal);font:500 15px 'Onest',sans-serif">+ Добавить звук</button>
    </div>
  </div>
</div>
</template>
<div id="app"></div>
<script>
class Component extends DCLogic {
  renderVals() {
    const on = 'background:var(--signal);color:var(--signal-ink);border:1px solid var(--signal)';
    const off = 'background:var(--surface);color:var(--fg);border:1px solid var(--line)';
    const dot = (v) => v ? 'background:var(--signal)' : 'background:var(--surface-2);border:1px solid var(--line)';
    const navDefs = [['Микшер','M6 4v16M12 4v16M18 4v16','main.html'],['Выходы','M4 9v6h4l5 4V5L8 9H4zM16.5 8.5a5 5 0 0 1 0 7','#'],['Сцены','M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z','scenes.html'],['Эффекты','M3 12h3l2-6 4 12 3-9 2 3h4','effects.html'],['Запись','M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16z','record.html'],['Устройства','M7 3h10a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zM12 11a3 3 0 1 0 0 6a3 3 0 1 0 0-6z','#'],['Настройки','M12 2v3M12 19v3M2 12h3M19 12h3M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z','strips.html']];
    const nav = navDefs.map((n) => ({ name: n[0], d: n[1], href: n[2], style: n[0] === 'Эффекты' ? 'background:var(--signal-soft);color:var(--signal);font-weight:600' : 'background:none;color:var(--muted)' }));
    const outs = [['B1 · Для стрима',1],['B2 · Для звонков',0],['A2 · Мне в наушники',1]].map((o) => ({ name: o[0], on: !!o[1], style: o[1] ? on : off }));
    const P = [['Аплодисменты','F1','0:04',0],['Барабанная дробь','F2','0:03',0],['Смех','F3','0:02',0],['Сирена','F4','0:05',62],['Вау','F5','0:01',0],['Дзынь','F6','0:01',0],['Фейл','F7','0:03',0],['Победа','F8','0:06',0],['Ой','F9','0:01',0],['Тревога','F10','0:08',0],['Тишина в зале','F11','0:04',0]];
    const pads = P.map((p) => ({ name: p[0], key: p[1], len: p[3] ? 'играет · ' + p[2] : p[2], pct: p[3], style: p[3] ? 'background:var(--signal-soft);color:var(--fg);border:1px solid var(--signal);box-shadow:0 0 0 1px var(--signal)' : 'background:var(--surface);color:var(--fg);border:1px solid var(--line)' }));
    return { nav, outs, pads };
  }
}
</script>
<script>DC.mount(Component);</script>
<script src="app.js"></script>
</body>
</html>
