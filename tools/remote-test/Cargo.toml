# Проверка удалённого пульта без Tauri и без Windows: настоящий src-tauri/src/remote.rs с тестовым «движком».
# Запуск: cd tools/remote-test && cargo run -- 8099 /tmp/remote-test.log   (и tools/remote-test/check.mjs)
[package]
name = "remote-test"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde_json = "1"

[workspace]
